<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Race - Game Milikku</title>
    <!-- Manggil CSS di head -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box-game-utama">
        <h1>LEXICON RACE</h1>
        <p class="sub-judul">KETIK KATA DI BAWAH LALU TEKAN SPASI!</p>

        <div class="baris-info-game">
            <div class="kotak-skor-kecil">
                <span>WAKTU</span>
                <div class="angka-info" id="time">60</div>
            </div>
            <div class="kotak-skor-kecil">
                <span>SKOR</span>
                <div class="angka-info" id="wpm">0</div>
            </div>
            <div class="kotak-skor-kecil">
                <span>AKURASI</span>
                <div class="angka-info" id="accuracy">0%</div>
            </div>
            <div class="kotak-skor-kecil">
                <span>REKOR</span>
                <div class="angka-info" id="high-score">0</div>
            </div>
>
        <div class="area-tampil-kata" id="word-to-type">READY</div>
        <input type="text" class="kolom-ketik-user" id="word-input" placeholder="Mulai mengetik di sini..." autocomplete="off" autofocus>
        <button class="tombol-reset-game" id="btn-restart">MAIN LAGI</button>
    </div>

    <!-- File JS -->
    <script src="script.js"></script>
</body>
</html>
