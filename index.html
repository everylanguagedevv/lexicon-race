<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Race</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box-utama-brutal">
        <h1 class="title-brutal">LEXICON RACE</h1>
        <h2 class="panduan-teks">Press space after typing..</h2>

        <div class="papan-info-mentah">
            <div class="kartu-info">
                <span class="label-info">Time</span>
                <div class="angka-info" id="time">120</div>
            </div>
            <div class="kartu-info">
                <span class="label-info">Words per minute</span>
                <div class="angka-info" id="wpm">0</div>
            </div>
            <div class="kartu-info">
                <span class="label-info">Accuracy</span>
                <div class="angka-info" id="accuracy">0%</div>
            </div>
            <div class="kartu-info aksen-biru">
                <span class="label-info">Record</span>
                <div class="angka-info" id="high-score">0</div>
            </div>
        </div>

        <div class="box-kata-target" id="word-to-type">READY</div>
        <input type="text" class="input-brutal" id="word-input" placeholder="Type here..." autocomplete="off" autofocus>
        <button class="tombol-brutal" id="btn-restart">REPLAY</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
